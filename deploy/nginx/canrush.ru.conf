# /etc/nginx/sites-available/canrush.ru — nginx on the host in front of the site container.

# Upgrade/close only when the client actually asks for a WebSocket.
map $http_upgrade $canrush_connection {
    default upgrade;
    ''      '';
}

# `site` on 3002. The backup is `site-standby` on 3003, which runs only during deploy/deploy-site.sh: while `site`
# is recreated, a refused connection goes to the standby, so nobody sees 502 or has to reload. A refused
# connection means the request was never sent, so POSTs (server actions) move over safely too.
upstream canrush_site {
    server 127.0.0.1:3002 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:3003 backup;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name canrush.ru www.canrush.ru;

    client_max_body_size 26m;

    ssl_certificate /etc/letsencrypt/live/canrush.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canrush.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://canrush_site;
        proxy_connect_timeout 2s;
        # `error` only, not `timeout`: with max_fails=1 one slow response (a stuck /_next/image) marked `site` dead
        # for fail_timeout, and with no standby running every page got 502. A refused connection during deploy is
        # still an `error` and still goes to the standby; a slow request gets its own 504.
        proxy_next_upstream error http_502;
        proxy_next_upstream_tries 2;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $canrush_connection;
    }
}

server {
    listen 80;
    server_name canrush.ru www.canrush.ru;

    return 301 https://$host$request_uri;
}
